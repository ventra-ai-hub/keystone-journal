    const missed = f.exec === "missed";
    const doc = { ...sig, taken: !missed, exec: f.exec, changes: changed ? f.changes.slice() : [], myStop: changed && f.changes.includes("stop") ? n.myStop : null, myPnl: changed ? n.myPnl : null,
      instrument: f.instrument, qty: missed ? null : n.qty, account: missed ? "" : f.account.trim(), mfe: n.mfe, mae: n.mae, notes: f.notes.trim() };
    m.busy = true; m.err = ""; renderModal();
    const now = new Date().toISOString();
    const prev = m.id ? S.trades.find((t) => t.id === m.id) : null;
    const col = S.db.collection("trades");
    const ref = m.id ? col.doc(m.id) : col.doc();
    let upId = null;
    try {
      if (m.shot.blob && S.assets) { const up = await S.assets.upload(m.shot.blob, { type: m.shot.blob.type }); upId = up.id; }
      const oldShot = prev ? prev.shot || null : null;
      doc.shot = upId || (m.shot.remove ? null : oldShot);
      doc.sig = m.sig || ref.id;
      doc.createdAt = prev && prev.createdAt ? prev.createdAt : now;
      doc.updatedAt = now;
      await ref.set(doc);
      // keep this trade's other accounts in step with the indicator's details
      const touched = [];
      for (const t of S.trades.filter((x) => x.id !== ref.id && sigKey(x) === doc.sig)) {
        const diff = {};
        for (const k of SIGNAL_FIELDS) if (!same(t[k], doc[k])) diff[k] = doc[k];
        if (Object.keys(diff).length) { const before = plain(t); await col.doc(t.id).update({ ...diff, updatedAt: now }); touched.push([t.id, before]); }
      }
      if (!missed) store.set("kj-last", { instrument: doc.instrument, qty: doc.qty, account: doc.account });
      const prevDoc = prev ? plain(prev) : null;
      const replaced = oldShot && oldShot !== doc.shot ? oldShot : null;
      m.busy = false;
      closeModal(true);
      toast(prev ? "Changes saved" : "Trade saved", async () => {
        if (prevDoc) await ref.set(prevDoc); else await ref.delete();
        for (const [id, before] of touched) await col.doc(id).set(before);
        if (upId && S.assets) { try { await S.assets.delete(upId); } catch (e) {} }
      }, () => { if (replaced && S.assets) S.assets.delete(replaced).catch(() => {}); });
    } catch (err) {
      if (upId && S.assets) S.assets.delete(upId).catch(() => {});
      m.busy = false; m.err = errMsg(err);
      renderModal();
    }
  }
  async function del() {
    const m = S.modal;
    if (!m || !m.id || m.busy) return;
    if (!S.db || !S.writable) return modalErr("This journal is read-only here.");
    if (!m.delArmed) {
      m.delArmed = true; m.focus = "delete"; renderModal();
      clearTimeout(m.delT);
      m.delT = setTimeout(() => { if (S.modal === m && m.delArmed) { m.delArmed = false; m.focus = "delete"; renderModal(); } }, 5000);
      return;
    }
    const prev = S.trades.find((t) => t.id === m.id);
    if (!prev) { closeModal(true); return; }
    const ref = S.db.collection("trades").doc(m.id), before = plain(prev);
    try {
      m.busy = true;
      await ref.delete();
      closeModal(true);
      toast("Trade deleted", async () => { await ref.set(before); }, () => { if (before.shot && S.assets) S.assets.delete(before.shot).catch(() => {}); });
    } catch (err) { m.busy = false; m.delArmed = false; m.err = "Couldn't delete just now. Try again."; renderModal(); }
  }

  // ---------- events ----------
  document.addEventListener("click", (e) => {
    if (e.target.classList && e.target.classList.contains("scrim")) { if (S.modal) closeModal(false); else closeSheet(); return; }
    if (e.target === viewer || e.target.id === "viewerImg") { viewer.hidden = true; return; }
    const el = e.target.closest && e.target.closest("[data-act]");
    if (!el) return;
    const act = el.getAttribute("data-act"), v = el.getAttribute("data-v"), m = S.modal;
    switch (act) {
      case "nav": go(v); break;
      case "theme": { const next = currentTheme() === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", next); store.set("kj-theme", next); render(); if (S.modal) renderModal(); break; }
      case "sync": if (APP) { S.syncDraft = syncCfg(); openSheet("sync"); } else resync(); break;
      case "new": if (S.db && S.writable) { S.sheet = null; openModal(); } break;
      case "guide": openSheet("guide"); break;
      case "month-nav": {
        const now = eveningDate(), n = Number(v);
        let y = S.cal ? S.cal.y : Number(now.slice(0, 4)), mo = S.cal ? S.cal.mo : Number(now.slice(5, 7)) - 1;
        if (n === 0) { y = Number(now.slice(0, 4)); mo = Number(now.slice(5, 7)) - 1; }
        else { mo += n; if (mo < 0) { mo = 11; y--; } if (mo > 11) { mo = 0; y++; } }
        S.cal = { y, mo, day: null };
        render();
        break;
      }
      case "month-day": if (S.cal) { S.cal.day = v; render(); } break;
      case "guide-log": S.sheet = null; if (S.db && S.writable) openModal(); else renderModal(); break;
      case "form-help": if (m) { m.help = !m.help; m.focus = "form-help"; renderModal(); } break;
      case "sync-save": syncSave(); break;
      case "sync-off": store.set("kj-sync", null); S.syncDraft = { token: "", gist: "" }; setSync("off", ""); renderModal(); toast("Sync is off on this device. Your trades stay here."); break;
      case "sync-copy": { const g = syncCfg().gist; const done = () => toast("Gist link copied"); try { navigator.clipboard.writeText("https://gist.github.com/" + g).then(done, () => toast("Couldn't copy it. The ID is in the box.")); } catch (err) { toast("Couldn't copy it. The ID is in the box."); } break; }
      case "backup": downloadBackup(); break;
      case "import": { const fi = $("#importFile"); if (fi) fi.click(); break; }
      case "edit": openModal(el.getAttribute("data-id")); break;
      case "filter": S.filter = v; render(); break;
      case "missed": S.countMissed = !S.countMissed; store.set("kj-missed", S.countMissed); render(); break;
      case "export": exportCsv(); break;
      case "shot": { e.stopPropagation(); const vi = $("#viewerImg"); vi.setAttribute("data-asset", v); vi.src = assetSrc(v); viewer.hidden = false; break; }
      case "undo": runUndo(); break;
      case "close": if (S.modal) closeModal(false); else closeSheet(); break;
      case "set": if (m) { const k = el.getAttribute("data-fld"); m.f[k] = v; if (k === "setup" && !GAP.includes(v)) m.f.aplus = false; m.dirty = true; m.err = ""; renderModal(); } break;
      case "aplus": if (m) { m.f.aplus = !m.f.aplus; m.dirty = true; renderModal(); } break;
      case "chg": if (m) { const i = m.f.changes.indexOf(v); if (i >= 0) m.f.changes.splice(i, 1); else m.f.changes.push(v); m.dirty = true; renderModal(); } break;
      case "cal": if (m) { m.cal.open = !m.cal.open; if (m.cal.open) { const ds = validDate(m.f.date) ? m.f.date : lastSession(); m.cal.y = Number(ds.slice(0, 4)); m.cal.mo = Number(ds.slice(5, 7)) - 1; } renderModal(); } break;
      case "cal-nav": if (m) { m.cal.mo += Number(v); if (m.cal.mo < 0) { m.cal.mo = 11; m.cal.y--; } if (m.cal.mo > 11) { m.cal.mo = 0; m.cal.y++; } renderModal(); } break;
      case "cal-pick": if (m) { m.f.date = v; m.cal.open = false; m.dirty = true; m.focus = "cal"; renderModal(); } break;
      case "acct-open": if (m) { m.acct = { open: true, q: "" }; m.focus = "acct-q"; renderModal(); } break;
      case "acct-pick": if (m) { m.f.account = v || ""; m.acct.open = false; m.dirty = true; m.focus = "acct-btn"; renderModal(); } break;
      case "acct-add": if (m) { m.f.account = m.acct.q.trim(); m.acct.open = false; m.dirty = true; m.focus = "acct-btn"; renderModal(); } break;
      case "shot-pick": { const fi = $("#shotFile"); if (fi) fi.click(); break; }
      case "shot-remove": if (m) { if (m.shot.url) URL.revokeObjectURL(m.shot.url); m.shot = { blob: null, url: null, remove: true }; m.dirty = true; renderModal(); } break;
      case "more": if (m) { m.more = !m.more; m.focus = "more"; renderModal(); } break;
      case "save": save(); break;
      case "delete": del(); break;
      case "sibling": if (m) {
        if (m.dirty) { m.err = "Save your changes first, then add the other account."; renderModal(); break; }
        const t = S.trades.find((x) => x.id === m.id);
        if (t) { S.modal = null; openModal(null, { from: t }); }
        break;
      }
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (!viewer.hidden) { viewer.hidden = true; return; }
      const m = S.modal;
      if (!m && S.sheet) { e.preventDefault(); closeSheet(); return; }
      if (m) {
        e.preventDefault();
        if (m.acct.open) { m.acct.open = false; m.focus = "acct-btn"; renderModal(); }
        else if (m.cal.open) { m.cal.open = false; m.focus = "cal"; renderModal(); }
        else closeModal(false);
        return;
      }
      hideTip();
      return;
    }
    const t = e.target;
    if ((e.key === "Enter" || e.key === " ") && t && t.matches && t.matches('[role="button"][data-act]')) { e.preventDefault(); t.click(); return; }
    if (e.key === "Enter" && t && t.hasAttribute && t.hasAttribute("data-acct-q")) { e.preventDefault(); const first = $("#plRows .pl-row"); if (first) first.click(); }
  });
  modalRoot.addEventListener("input", (e) => {
    const m = S.modal, el = e.target;
    if (el.hasAttribute("data-sync")) { S.syncDraft = S.syncDraft || syncCfg(); S.syncDraft[el.getAttribute("data-sync")] = el.value.trim(); return; }
    if (!m) return;
    if (el.hasAttribute("data-f")) { m.f[el.getAttribute("data-f")] = el.value; m.dirty = true; patchCalc(); return; }
    if (el.hasAttribute("data-acct-q")) { m.acct.q = el.value; const r = $("#plRows"); if (r) r.innerHTML = acctRows(m); return; }
    if (el.hasAttribute("data-maxrisk")) { const v = numOf(el.value); if (isNum(v) && v > 0) { S.maxRisk = v; store.set("kj-maxrisk", v); } patchCalc(); }
  });
  modalRoot.addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (e.target.id === "shotFile") takeShot(f);
    if (e.target.id === "importFile") { importFile(f); e.target.value = ""; }
  });
  app.addEventListener("input", (e) => {
    const k = e.target.getAttribute && e.target.getAttribute("data-size");
    if (!k) return;
    if (k === "stop") S.size.stop = e.target.value;
    else { const v = numOf(e.target.value); if (isNum(v) && v > 0) { S.maxRisk = v; store.set("kj-maxrisk", v); } }
    const out = $("#sizeOut");
    if (out) out.innerHTML = sizeOut();
  });
  document.addEventListener("paste", (e) => {
    const m = S.modal;
    if (!m || !S.assets) return;
    const items = e.clipboardData ? [...e.clipboardData.items] : [];
    const it = items.find((i) => i.kind === "file" && i.type.startsWith("image/"));
    if (!it) return;
    const a = document.activeElement;
    const typing = a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "file"));
    if (typing && a.getAttribute("data-k") !== "shot") return;
    e.preventDefault();
    takeShot(it.getAsFile());
  });
  let rsz;
  window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (S.lastD) drawEquity(S.lastD); }, 150); });
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!document.documentElement.getAttribute("data-theme")) render(); }); } catch (e) {}
  setInterval(updateClock, 20000);

  async function exportCsv() {
    if (!S.downloads) return;
    const cols = ["date", "time", "setup", "aplus", "dir", "taken", "exec", "changes", "entry", "stop", "target", "outcome", "exit", "pnl", "myStop", "myPnl", "instrument", "qty", "account", "mfe", "mae", "notes", "sig", "id", "createdAt", "updatedAt"];
    const cell = (v) => { const s = v == null ? "" : Array.isArray(v) ? v.join(" ") : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const rows = S.trades.slice().sort(order).map((t) => cols.map((c) => cell(c === "sig" ? sigKey(t) : t[c])).join(","));
    try { await S.downloads.save({ filename: "keystone-journal.csv", data: [cols.join(","), ...rows].join("\n") }); }
    catch (err) { if (!err || err.code !== "declined") toast("Couldn't export the CSV here."); }
  }

  // ---------- start ----------
  function banner(msg) { const b = $("#banner"); b.textContent = msg || ""; b.hidden = !msg; }
  function subscribe() {
    S.unsub.forEach((u) => { try { u(); } catch (e) {} });
    S.unsub = [];
    S.live = APP ? syncLive() : "connecting";
    render();
    S.unsub.push(S.db.collection("trades").onSnapshot((snap) => {
      S.trades = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      S.loaded = true; S.live = APP ? syncLive() : "live";
      render();
    }, () => { S.loaded = true; S.live = "offline"; render(); }));
    S.unsub.push(S.db.doc("config/backtest").onSnapshot((snap) => { S.backtest = snap.exists ? snap.data() : null; render(); }, () => {}));
  }
  function resync() {
    if (!S.db) { toast("Open the journal on claude.ai while signed in to sync it."); return; }
    if (S.live === "live") { toast("Your journal is up to date"); return; }
    subscribe();
  }
  const saved = store.get("kj-theme", null);
  if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
  S.route = routeOf(location.hash);
  S.riseUntil = Date.now() + 1400;
  render();
  if (APP) {
    L.st = localLoad();
    L.sync.state = syncCfg().token ? "pending" : "off";
    let ok = true;
    try { localStorage.setItem("kj-probe", "1"); localStorage.removeItem("kj-probe"); } catch (e) { ok = false; }
    if (!ok) banner("This browser won't let the journal save (private browsing or storage turned off). Trades you add will be lost when you close it.");
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  (async () => {
    const use = APP ? localUse : window.claude && typeof window.claude.use === "function" ? (n) => window.claude.use(n) : async () => null;
    let db = null;
    try { db = await use("db"); } catch (e) {}
    if (!db) {
      S.loaded = true; S.live = "local"; S.writable = false;
      banner("Journal storage isn't available in this view. Open the journal on claude.ai while signed in to log and see your trades.");
      render();
      return;
    }
    S.db = db;
    let user = null;
    try { user = await use("user"); } catch (e) {}
    let canWrite = null;
    if (user) { try { canWrite = await user.can("data.write"); } catch (e) {} }
    if (canWrite === false) { S.writable = false; banner("You can read this journal but not change it."); }
    if (S.writable) { try { S.assets = await use("assets"); } catch (e) {} }
    try { S.downloads = await use("downloads"); } catch (e) {}
    subscribe();
    if (APP && syncCfg().token) syncNow();
  })();
})();
</script>
</body>
</html>
