<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keystone Journal</title>
<meta name="description" content="Every trade, win runs, plan adherence and the live edge against the backtest.">
<meta name="theme-color" content="#121117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keystone">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=1">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600&display=swap">
<style>
/* Keystone Journal in the Client Success look: frosted glass over a soft blurred backdrop, light Urbanist type,
   dot-matrix numbers, hairline charts. Charcoal dark mode with a warm glow; the default follows the system. */
:root {
  --bg: #e4e2ea; --ink: #1c1a29; --ink2: rgba(28,26,41,.64); --ink3: rgba(28,26,41,.44);
  --line: rgba(28,26,41,.08); --chip: rgba(28,26,41,.06);
  --glass: rgba(255,255,255,.5); --glass-hi: rgba(255,255,255,.78); --glass-solid: rgba(251,250,253,.9);
  --edge: rgba(255,255,255,.72); --shadow: 0 24px 60px -28px rgba(46,36,92,.36);
  --coral: #ec4a4a; --lime: #c6e43a; --good: #23936f; --warn: #c98317;
  --honey: #c9921b; --sky: #2f86c9; --peri: #6c62d8; --violet: #7a5cd0; --sea: #23936f; --apricot: #df7434; --stone: #85829a; --blush: #d4577a;
  --on-sky: #ffffff;
  --b1: #8e84bf; --b2: #c4bee2; --b3: #c690bb; --b4: #b4acd8; --b5: #cecadd;
  --grid: rgba(255,255,255,.22); --r: 30px;
  --font: "Urbanist", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121117; --ink: #ecebf3; --ink2: rgba(236,235,243,.68); --ink3: rgba(236,235,243,.42);
    --line: rgba(255,255,255,.08); --chip: rgba(255,255,255,.07);
    --glass: rgba(42,40,52,.5); --glass-hi: rgba(54,51,66,.72); --glass-solid: rgba(30,29,37,.94);
    --edge: rgba(255,255,255,.12); --shadow: 0 24px 60px -24px rgba(0,0,0,.6);
    --b1: #3b3750; --b2: #524d6c; --b3: #5c3f8a; --b4: #4a3a60; --b5: #1b1a22; --grid: rgba(255,255,255,.04);
    --good: #5fd3a8; --warn: #f0b04a; --honey: #f0c157; --sky: #7cc0f2; --peri: #a9a2f5; --violet: #a993f2; --sea: #5fd3a8;
    --apricot: #f6a26b; --stone: #aeabc0; --blush: #f08aa7; --on-sky: #0d2433;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121117; --ink: #ecebf3; --ink2: rgba(236,235,243,.68); --ink3: rgba(236,235,243,.42);
  --line: rgba(255,255,255,.08); --chip: rgba(255,255,255,.07);
  --glass: rgba(42,40,52,.5); --glass-hi: rgba(54,51,66,.72); --glass-solid: rgba(30,29,37,.94);
  --edge: rgba(255,255,255,.12); --shadow: 0 24px 60px -24px rgba(0,0,0,.6);
  --b1: #3b3750; --b2: #524d6c; --b3: #5c3f8a; --b4: #4a3a60; --b5: #1b1a22; --grid: rgba(255,255,255,.04);
  --good: #5fd3a8; --warn: #f0b04a; --honey: #f0c157; --sky: #7cc0f2; --peri: #a9a2f5; --violet: #a993f2; --sea: #5fd3a8;
  --apricot: #f6a26b; --stone: #aeabc0; --blush: #f08aa7; --on-sky: #0d2433;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
html.modal-open { overflow: hidden; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

/* backdrop: a soft gradient, four blurred blobs and a faint grid that fades out down the page */
.backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: linear-gradient(160deg, var(--b5), var(--bg) 60%); }
.blob { position: absolute; border-radius: 50%; filter: blur(70px); }
.blob.b1 { width: 48vw; height: 48vw; right: -14vw; top: -18vw; background: var(--b1); opacity: .55; }
.blob.b2 { width: 42vw; height: 42vw; left: -12vw; top: -16vw; background: var(--b2); opacity: .6; }
.blob.b3 { width: 40vw; height: 40vw; left: -8vw; top: 34vh; background: var(--b3); opacity: .7; }
.blob.b4 { width: 46vw; height: 46vw; right: -12vw; bottom: -18vw; background: var(--b4); opacity: .6; }
.gridl { position: absolute; inset: 0; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 44px 44px; -webkit-mask-image: linear-gradient(#000, transparent 55%); mask-image: linear-gradient(#000, transparent 55%); }

.wrap { position: relative; z-index: 1; max-width: 1220px; margin: 0 auto; padding: 0 16px 132px; }
@media (min-width: 760px) { .wrap { padding-inline: 28px; } }

/* glass */
.card { position: relative; min-width: 0; background: var(--glass); -webkit-backdrop-filter: blur(26px) saturate(1.5); backdrop-filter: blur(26px) saturate(1.5); border: 1px solid var(--edge); border-radius: var(--r); box-shadow: var(--shadow), inset 0 1px 0 var(--edge); }

/* top bar */
.top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 18px 0 4px; }
.brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; font: 500 16px var(--font); letter-spacing: -.01em; }
.mark { width: 32px; height: 32px; flex: none; border-radius: 9px; box-shadow: 0 6px 16px -8px rgba(46,36,92,.55); }
.nav { justify-self: center; display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; border: 1px solid var(--edge); background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); box-shadow: inset 0 1px 0 var(--edge); }
.nav button { height: 34px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: var(--ink2); font: 500 14px var(--font); cursor: pointer; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tools { display: flex; align-items: center; gap: 8px; }
.clock { display: inline-flex; align-items: center; gap: 12px; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--edge); background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); font: 400 13.5px var(--font); color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock b { font-weight: 600; color: var(--ink); }
.round { position: relative; display: inline-grid; place-items: center; flex: none; width: 40px; height: 40px; padding: 0; border-radius: 50%; border: 1px solid var(--edge); background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); color: var(--ink); cursor: pointer; box-shadow: inset 0 1px 0 var(--edge); }
.round.sm { width: 32px; height: 32px; }
.round:disabled { opacity: .35; cursor: not-allowed; }
.sync .sdot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--stone); box-shadow: 0 0 0 2px var(--glass-solid); }
.sync.live .sdot { background: var(--good); }
.sync.connecting .sdot { background: var(--warn); }
.sync.offline .sdot { background: var(--coral); }
@media (max-width: 760px) {
  .top { grid-template-columns: minmax(0, 1fr) auto; }
  .nav { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; justify-content: center; }
  .nav button { flex: 1; padding: 0 6px; font-size: 13.5px; }
  .clock .hb { display: none; }
}
@media (max-width: 400px) { .clock { display: none; } }

.banner { margin: 14px 0 0; padding: 12px 16px; border-radius: 18px; border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 12%, var(--glass)); font-size: 14px; }

/* page header */
.head { padding: 26px 2px 22px; }
.eyebrow { font: 500 13px var(--font); color: var(--ink2); letter-spacing: .01em; }
.head h1 { margin: 8px 0 10px; font-weight: 300; font-size: clamp(40px, 5.2vw, 68px); line-height: 1.02; letter-spacing: -.025em; text-wrap: balance; }
.lede { margin: 0; max-width: 72ch; font-size: 16px; color: var(--ink2); }
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

/* buttons */
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--edge); background: var(--glass-hi); color: var(--ink); font: 500 14px var(--font); cursor: pointer; white-space: nowrap; box-shadow: inset 0 1px 0 var(--edge); }
.pill.dark { background: var(--ink); color: var(--bg); border-color: transparent; }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.pill.danger { color: var(--coral); border-color: color-mix(in srgb, var(--coral) 45%, transparent); }
.pill.danger.armed { background: var(--coral); border-color: var(--coral); color: #fff; }
.pill.ghost { background: transparent; box-shadow: none; }
.pill.on { background: var(--ink); color: var(--bg); border-color: transparent; }
.pill:disabled { opacity: .5; cursor: not-allowed; }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1180px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 620px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.tile { display: grid; align-content: space-between; gap: 12px; min-height: 138px; padding: 16px 18px 15px; border-radius: 24px; }
.t-lbl { display: flex; align-items: center; gap: 7px; font: 500 13.5px var(--font); color: var(--ink2); }
.adot { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 3px color-mix(in srgb, var(--coral) 20%, transparent); }
.t-num { color: var(--ink); line-height: 0; min-width: 0; }
.tile.alert .t-num { color: var(--coral); }
.tile.good .t-num { color: var(--good); }
.t-sub { font-size: 12.5px; line-height: 1.35; color: var(--ink3); }
.dm { display: block; max-width: 100%; height: auto; }

/* layout */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.s12 { grid-column: span 12; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; }
@media (max-width: 980px) { .s7, .s6, .s5 { grid-column: span 12; } }
@media (max-width: 700px) { .s4 { grid-column: span 12; } }
.card-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 14px; padding: 18px 22px 4px; }
.card-h h2 { margin: 0; font-weight: 400; font-size: 19px; letter-spacing: -.015em; }
.note { font-size: 13px; color: var(--ink2); }
.card-b { padding: 10px 22px 20px; }
@media (max-width: 620px) { .card-h { padding: 16px 16px 4px; } .card-b { padding: 10px 16px 18px; } }
.ctx { margin: 12px 0 0; max-width: 68ch; font-size: 13.5px; color: var(--ink2); }
.foot { margin: 12px 0 0; font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.empty { margin: 0; padding: 22px; font-size: 14px; color: var(--ink2); }

/* chips: a coloured dot and the label on a light tint */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--chip); color: var(--ink); font: 500 12px var(--font); white-space: nowrap; }
.chip > i { width: 7px; height: 7px; border-radius: 50%; background: var(--stone); flex: none; }
.chip.ok { background: color-mix(in srgb, var(--good) 13%, transparent); } .chip.ok > i { background: var(--good); }
.chip.loss { background: color-mix(in srgb, var(--blush) 14%, transparent); } .chip.loss > i { background: var(--blush); }
.chip.late { background: color-mix(in srgb, var(--coral) 13%, transparent); } .chip.late > i { background: var(--coral); }
.chip.due { background: color-mix(in srgb, var(--warn) 15%, transparent); } .chip.due > i { background: var(--warn); }
.chip.ap { background: color-mix(in srgb, var(--sky) 15%, transparent); } .chip.ap > i { background: var(--sky); }


/* every trade: the balls */
.runs-b { display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr); gap: 18px 30px; align-items: start; }
@media (max-width: 700px) { .runs-b { grid-template-columns: minmax(0, 1fr); } }
.run-now .cap { margin-top: 10px; font-size: 14px; color: var(--ink2); }
.run-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 16px 0 0; }
.run-stats dt { font-size: 12px; color: var(--ink3); }
.run-stats dd { margin: 2px 0 0; font-weight: 500; }
.balls { display: flex; flex-wrap: wrap; gap: 2px; min-height: 32px; align-items: center; }
.ball { position: relative; display: grid; place-items: center; width: 28px; height: 32px; padding: 0; border: 0; border-radius: 10px; background: transparent; cursor: pointer; }
.ball:hover { background: var(--chip); }
.ball i { display: block; width: 16px; height: 16px; border-radius: 50%; }
.ball.win i { background: var(--good); }
.ball.loss i { box-shadow: inset 0 0 0 2.5px var(--blush); }
.ball.be i { width: 9px; height: 9px; background: var(--stone); }
.ball.unk i { border: 1.5px dashed var(--ink3); }
.ball .chg { position: absolute; left: 50%; bottom: 2px; width: 12px; height: 2.5px; margin-left: -6px; border-radius: 2px; background: var(--warn); }
.ball .ap { position: absolute; left: 50%; top: 1px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--sky); }
.empty-b { font-size: 14px; color: var(--ink3); }
.legend, .keys, .scale-key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink2); }
.legend { margin-top: 12px; }
.legend span, .keys span, .scale-key span { display: inline-flex; align-items: center; gap: 6px; }
.lg { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.lg.win { background: var(--good); }
.lg.loss { box-shadow: inset 0 0 0 2px var(--blush); }
.lg.be { width: 7px; height: 7px; background: var(--stone); }
.lg.chg { width: 12px; height: 3px; border-radius: 2px; background: var(--warn); }
.lg.ap { width: 6px; height: 6px; background: var(--sky); }

/* last 14 nights */
.fort { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; text-align: center; }
.fd { display: grid; justify-items: center; gap: 6px; min-width: 0; border-radius: 10px; padding: 2px 0; }
.fd .wd { font-size: 11px; color: var(--ink3); }
.fd .c { display: block; width: min(24px, 100%); aspect-ratio: 1; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line); }
.fd .dn { font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; }
/* shape carries the result as well as colour (green and pink sit close for red-green colour blindness): solid = up night,
   ring = down night, centre dot = flat, the same as the trade balls */
.fd.pos .c { background: var(--good); box-shadow: none; }
.fd.neg .c { background: transparent; box-shadow: inset 0 0 0 3px var(--blush); }
.fd.flat .c { background: radial-gradient(circle, var(--stone) 0 26%, transparent 29%); }
.fd.closed .c { box-shadow: none; background: var(--chip); opacity: .5; }
.fd.closed .wd, .fd.closed .dn { opacity: .5; }
.fd.today .c { outline: 2px solid var(--coral); outline-offset: 2px; filter: drop-shadow(0 0 8px color-mix(in srgb, var(--coral) 55%, transparent)); }
.fd.today .dn { color: var(--coral); font-weight: 600; }
.ruler { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; margin-top: 10px; border-top: 1px solid var(--line); }
.ruler i { justify-self: center; width: 1px; height: 7px; background: var(--ink3); }
.ruler i.now { width: 2px; height: 12px; border-radius: 1px; background: var(--coral); }

/* block of 20 */
.slots { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 4px; }
.slot { justify-self: center; width: 100%; max-width: 16px; aspect-ratio: 1; border-radius: 50%; }
.slot.win { background: var(--good); }
.slot.loss { box-shadow: inset 0 0 0 2px var(--blush); }
.slot.todo { box-shadow: inset 0 0 0 1px var(--ink3); opacity: .45; }
.scale { position: relative; height: 46px; margin: 18px 8px 0; }
.scale .track { position: absolute; left: 0; right: 0; top: 14px; height: 1px; background: var(--ink3); }
.scale .band, .k-band { background: color-mix(in srgb, var(--lime) 62%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 22%, transparent); }
.scale .band { position: absolute; top: 7px; height: 15px; border-radius: 8px; }
.scale .tk { position: absolute; top: 11px; width: 1px; height: 7px; background: var(--ink3); transform: translateX(-50%); }
.scale .tk.maj { top: 9px; height: 11px; }
.scale .tl { position: absolute; top: 26px; transform: translateX(-50%); font-size: 11.5px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.scale .now { position: absolute; top: 14px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--glass-solid); }
.scale .pace { position: absolute; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--glass-solid); box-shadow: inset 0 0 0 2px var(--ink2); transform: translate(-50%, -50%); }
.scale-key { margin-top: 4px; }
.k-band { display: inline-block; width: 18px; height: 9px; border-radius: 5px; }
.k-now { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.k-pace { display: inline-block; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink2); }
.past { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

/* pastel cards: dark ink on a cool-to-cream gradient in both themes */
.pastel { position: relative; overflow: hidden; min-width: 0; display: grid; align-content: start; gap: 6px; padding: 18px 20px 20px; border-radius: var(--r); color: #1c1a29; background: linear-gradient(165deg, var(--pa), var(--pb)); box-shadow: var(--shadow); }
.pastel::before { content: ""; position: absolute; left: -25%; top: -35%; width: 75%; height: 75%; background: radial-gradient(closest-side, rgba(255,255,255,.7), rgba(255,255,255,0)); pointer-events: none; }
.pastel::after { content: ""; position: absolute; right: -20%; bottom: -35%; width: 65%; height: 75%; border-radius: 50%; background: var(--pd); filter: blur(42px); opacity: .42; pointer-events: none; }
.pastel > * { position: relative; z-index: 1; }
.ppill { justify-self: start; display: inline-flex; align-items: center; height: 26px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.75); font: 500 12px var(--font); color: #1c1a29; }
.pastel .big { margin-top: 10px; font-weight: 300; font-size: 52px; line-height: 1; letter-spacing: -.035em; }
.pastel p { margin: 0; max-width: 36ch; font-size: 14.5px; color: rgba(28,26,41,.78); }
.pastel .small { margin-top: 6px; font-size: 12.5px; color: rgba(28,26,41,.62); }
.p-sky { --pa: #8cc4f0; --pb: #eef0e3; --pd: #3c8fd6; }
.p-sea { --pa: #93dcc4; --pb: #eef3de; --pd: #2a9c7c; }
.p-apricot { --pa: #f7b088; --pb: #faead4; --pd: #e0743a; }
.p-peri { --pa: #b3b0f2; --pb: #efe9f5; --pd: #6a61d8; }
.p-lilac { --pa: #cbbcf2; --pb: #f3effa; --pd: #7a5cd0; }
.p-mauve { --pa: #e6bcd9; --pb: #f9eff5; --pd: #b0568f; }
.p-fog { --pa: #c8c4dc; --pb: #f2f1f7; --pd: #6d6890; }

/* equity */
.eq { min-height: 230px; }
.eq.is-empty { min-height: 0; }
.eq svg { display: block; width: 100%; height: 230px; overflow: visible; touch-action: pan-y; }
.eq-grid { stroke: var(--line); stroke-width: 1; }
.eq-zero { stroke: var(--ink3); stroke-width: 1; }
.eq-lbl { fill: var(--ink3); font: 500 11.5px var(--font); font-variant-numeric: tabular-nums; }
.eq-you { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.eq-plan { fill: none; stroke: var(--violet); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.eq-area { fill: var(--ink); fill-opacity: .06; }
.eq-dot { stroke: var(--glass-solid); stroke-width: 2; }
.eq-dot.you { fill: var(--ink); } .eq-dot.plan { fill: var(--violet); }
.eq-end { fill: var(--ink); font: 600 12.5px var(--font); font-variant-numeric: tabular-nums; }
.eq-x { stroke: var(--ink3); stroke-width: 1; }
.keys { margin-bottom: 8px; }

  };
  const localAssets = {
    upload: async (blob) => { const id = "img" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); await IDB.put(id, blob); const url = URL.createObjectURL(blob); L.urls.set(id, url); return { id, url }; },
    delete: async (id) => { await IDB.del(id); const u = L.urls.get(id); if (u) URL.revokeObjectURL(u); L.urls.delete(id); },
  };
  function assetSrc(id) {
    if (!APP) return "/_blob/" + encodeURIComponent(id);
    if (L.urls.has(id)) return L.urls.get(id);
    IDB.get(id).then((b) => {
      if (!b) return;
      const url = URL.createObjectURL(b);
      L.urls.set(id, url);
      document.querySelectorAll(`img[data-asset="${cssq(id)}"]`).forEach((im) => { im.src = url; });
    }).catch(() => {});
    return PIXEL;
  }
  const localDownloads = {
    save: async ({ filename, data }) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], { type: /\.json$/.test(filename) ? "application/json" : "text/csv" }));
      a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    },
  };
  const localUse = async (name) => {
    if (name === "db") return L.db || (L.db = localDb());
    if (name === "user") return { can: async () => true };
    if (name === "assets") return "indexedDB" in window ? localAssets : null;
    if (name === "downloads") return localDownloads;
    return null;
  };

  // sync: last write wins for each trade; deletions are kept as tombstones so they travel too
  function syncCfg() { const c = store.get("kj-sync", null) || {}; return { token: c.token || "", gist: c.gist || "" }; }
  function mergeStates(a, b) {
    const out = { docs: {}, dead: {} };
    const t = (d) => (d && (d._t || d.updatedAt)) || "";
    const paths = new Set([...Object.keys(a.docs), ...Object.keys(b.docs), ...Object.keys(a.dead || {}), ...Object.keys(b.dead || {})]);
    for (const p of paths) {
      if (!SYNCED.test(p)) continue;
      const A = a.docs[p], B = b.docs[p];
      const live = !A ? B : !B ? A : t(A) >= t(B) ? A : B;
      const dead = [a.dead && a.dead[p], b.dead && b.dead[p]].filter(Boolean).sort().pop();
      if (dead && (!live || dead >= t(live))) out.dead[p] = dead;
      else if (live) out.docs[p] = live;
    }
    return out;
  }
  const SYNCED = /^(trades|config)\//;
  const stamp = (s) => JSON.stringify([Object.keys(s.docs).sort().map((p) => p + "@" + (s.docs[p]._t || s.docs[p].updatedAt || "")), Object.keys(s.dead || {}).sort().map((p) => p + "@" + s.dead[p])]);
  const payload = () => JSON.stringify({ app: "keystone-journal", v: 1, savedAt: new Date().toISOString(), docs: Object.fromEntries(Object.entries(L.st.docs).filter(([p]) => SYNCED.test(p))), dead: L.st.dead });
  async function gh(path, opts) {
    const res = await fetch(GH + path, { ...(opts || {}), headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + syncCfg().token, ...(opts && opts.body ? { "Content-Type": "application/json" } : {}) } });
    if (!res.ok) { const e = new Error("GitHub " + res.status); e.status = res.status; throw e; }
    return res.json();
  }
  async function readGist(id) {
    const g = await gh("/gists/" + encodeURIComponent(id));
    const f = g.files && g.files[GIST_FILE];
    if (!f) return { docs: {}, dead: {} };
    let text = f.content;
    if (f.truncated && f.raw_url) text = await (await fetch(f.raw_url)).text();
    try { const o = JSON.parse(text); return { docs: o.docs || {}, dead: o.dead || {} }; } catch (e) { return { docs: {}, dead: {} }; }
  }
  const syncLive = () => ({ ok: "live", error: "offline", off: "local" }[L.sync.state] || "connecting");
  function ago(t) { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? "just now" : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} days ago`; }
  function syncTitle() {
    const st = L.sync.state;
    return st === "off" ? "Saved in this browser only. Tap to set up sync" : st === "error" ? "Sync stopped. Tap for details" : st === "ok" ? `Synced ${ago(L.sync.last)}` : "Syncing";
  }
  function syncStatusText() {
    if (!syncCfg().token) return "Saved in this browser only. Sync keeps your phone and Mac in step, and lets Claude read your trades.";
    const st = L.sync.state;
    return st === "error" ? L.sync.msg : st === "ok" ? `Synced ${ago(L.sync.last)} with your secret gist.` : "Syncing…";
  }
  function setSync(state, msg) {
    L.sync.state = state;
    if (msg != null) L.sync.msg = msg;
    if (!APP) return;
    S.live = syncLive();
    const b = app.querySelector(".sync");
    if (b) { b.className = "round sync " + S.live; b.title = syncTitle(); b.setAttribute("aria-label", syncTitle()); }
    const st = modalRoot.querySelector("#syncStatus");
    if (st) st.textContent = syncStatusText();
  }
  function schedulePush() {
    if (!APP || !syncCfg().token) return;
    clearTimeout(L.sync.timer);
    setSync("pending");
    L.sync.timer = setTimeout(() => syncNow(), 2500);
  }
  async function syncNow() {
    const c = syncCfg();
    if (!APP || !c.token) return;
    if (L.sync.busy) { schedulePush(); return; }
    L.sync.busy = true;
    clearTimeout(L.sync.timer);
    setSync("busy");
    try {
      if (!c.gist) {
        const g = await gh("/gists", { method: "POST", body: JSON.stringify({ description: "Keystone Journal data", public: false, files: { [GIST_FILE]: { content: payload() } } }) });
        store.set("kj-sync", { ...c, gist: g.id });
        if (S.syncDraft) S.syncDraft.gist = g.id;
      } else {
        const remote = await readGist(c.gist);
        const merged = mergeStates(L.st, remote);
        const changedHere = stamp(merged) !== stamp(L.st);
        L.st = merged;
        if (changedHere) { localSave(); localEmit(); }
        if (stamp(merged) !== stamp(remote)) await gh("/gists/" + encodeURIComponent(c.gist), { method: "PATCH", body: JSON.stringify({ files: { [GIST_FILE]: { content: payload() } } }) });
      }
      L.sync.last = Date.now();
      setSync("ok", "");
    } catch (e) {
      setSync("error", e.status === 401 || e.status === 403 ? "GitHub turned the token down. Check it has Gists: Read and write, and hasn't expired."
        : e.status === 404 ? "Couldn't find that gist. Check the ID, or clear it to make a new one."
        : "Couldn't reach GitHub. Your trades are saved here and sync once you're back online.");
    } finally {
      L.sync.busy = false;
      if (S.sheet === "sync" && !S.modal) renderModal();
    }
  }
  window.addEventListener("focus", () => { if (APP && syncCfg().token && Date.now() - L.sync.last > 60000) syncNow(); });

  // backup and import (both homes): this app's backup file, or the CSV export
  async function downloadBackup() {
    if (!S.downloads) return;
    const docs = {};
    for (const t of S.trades) { const { id, ...rest } = t; docs["trades/" + id] = rest; }
    if (S.backtest && S.backtest.plan) docs["config/backtest"] = S.backtest;
    const data = JSON.stringify({ app: "keystone-journal", v: 1, savedAt: new Date().toISOString(), docs }, null, 1);
    try { await S.downloads.save({ filename: `keystone-journal-backup-${new Date().toISOString().slice(0, 10)}.json`, data }); }
    catch (err) { if (!err || err.code !== "declined") toast("Couldn't save the backup here."); }
  }
  function parseCsv(text) {
    const rows = [];
    let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    const head = (rows.shift() || []).map((h) => h.trim());
    return rows.filter((r) => r.some((c) => c !== "")).map((r) => Object.fromEntries(head.map((h, i) => [h, r[i] == null ? "" : r[i]])));
  }
  function cleanTrade(o) {
    if (!o || !SETUP[o.setup]) return null;
    const t = {};
    for (const k of ["date", "time", "setup", "dir", "outcome", "exec", "account", "notes", "sig", "createdAt", "updatedAt"]) t[k] = o[k] == null ? "" : String(o[k]);
    for (const k of ["entry", "stop", "target", "exit", "pnl", "myStop", "myPnl", "qty", "mfe", "mae"]) { const v = o[k]; t[k] = v === "" || v == null ? null : isFinite(Number(v)) ? Number(v) : null; }
    t.aplus = o.aplus === true || o.aplus === "true";
    t.taken = !(o.taken === false || o.taken === "false");
    t.exec = ["shown", "changed", "missed"].includes(t.exec) ? t.exec : t.taken ? "shown" : "missed";
    t.changes = (Array.isArray(o.changes) ? o.changes : String(o.changes || "").split(/[\s,]+/)).filter((c) => CHG[c]);
    t.instrument = MULT[o.instrument] ? o.instrument : "GC";
    t.shot = null;
    if (!t.sig) delete t.sig;
    return t;
  }
  async function importFile(file) {
    if (!S.db || !S.writable) { toast("This view can't save trades."); return; }
    let list, bt = null;
    try {
      const text = await file.text();
      if (text.trim().startsWith("{")) {
        const o = JSON.parse(text);
        if (o.plan && o.setups) bt = o;                                   // just the backtest numbers
        else if (o.docs && o.docs["config/backtest"] && o.docs["config/backtest"].plan) bt = o.docs["config/backtest"];
        list = o.docs ? Object.entries(o.docs).filter(([p]) => p.startsWith("trades/")).map(([p, d]) => ({ ...d, id: p.slice(7) })) : Array.isArray(o.trades) ? o.trades : [];
      } else list = parseCsv(text);
    } catch (e) { toast("That file couldn't be read. Pick a backup from this journal or its CSV export."); return; }
    if (bt) { const { _t, ...clean } = bt; try { await S.db.doc("config/backtest").set(clean); } catch (e) { bt = null; } }
    let added = 0, had = 0, skipped = 0;
    for (const o of list) {
      const t = cleanTrade(o);
      if (!t) { skipped++; continue; }
      const id = /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(String(o.id || "")) ? String(o.id) : null;
      if (id && S.trades.some((x) => x.id === id)) { had++; continue; }
      const now = new Date().toISOString();
      if (!t.createdAt) t.createdAt = now;
      if (!t.updatedAt) t.updatedAt = now;
      const ref = id ? S.db.collection("trades").doc(id) : S.db.collection("trades").doc();
      if (!t.sig) t.sig = ref.id;
      try { await ref.set(t); added++; } catch (e) { skipped++; }
    }
    toast(`Imported ${plural(added, "trade")}${bt ? " and the backtest numbers" : ""}${had ? ` · ${had} already here` : ""}${skipped ? ` · ${skipped} skipped` : ""}`);
  }

  // ---------- everything the pages show ----------
  function derive() {
    const bt = S.backtest || {};
    const p0 = bt.plan && isNum(bt.plan.winRate) ? bt.plan.winRate : null;
    const all = S.trades.slice().sort(order);
    const taken = all.filter(isTaken);

    // one signal per trade the indicator showed: the same trade on two accounts counts once
    const groups = new Map();
    for (const t of all) { const k = sigKey(t); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); }
    const signals = [];
    for (const [key, list] of groups) {
      const t = list.find((x) => planRes(x) != null) || list[0];
      signals.push({ key, t, list, setup: t.setup, aplus: !!t.aplus && GAP.includes(t.setup), res: planRes(t), pts: planPts(t), taken: list.some(isTaken) });
    }
    signals.sort((a, b) => order(a.t, b.t));
    const plan = signals.filter((s) => s.setup !== "off" && (S.countMissed || s.taken));
    const T = { w: plan.filter((s) => s.res === 1).length, l: plan.filter((s) => s.res === -1).length, be: plan.filter((s) => s.res === 0).length };
    const wr = T.w + T.l ? T.w / (T.w + T.l) : null;

    // your trades: results, runs, money
    const yours = taken.map((t) => ({ t, res: yourRes(t), pts: yourPts(t) }));
    let run = 0, bestWin = 0, worstRun = 0;
    for (const y of yours) {
      if (y.res === 1) run = run > 0 ? run + 1 : 1;
      else if (y.res === -1) run = run < 0 ? run - 1 : -1;
      else if (y.res === 0) run = 0;
      bestWin = Math.max(bestWin, run);
      worstRun = Math.max(worstRun, -run);
    }
    let planRun = 0;
    for (let i = taken.length - 1; i >= 0; i--) { if (onPlan(taken[i])) planRun++; else break; }
    const onPlanN = taken.filter(onPlan).length;
    const known = yours.filter((y) => isNum(y.pts));
    const usdMode = known.length > 0 && known.every((y) => usdOf(y.t, y.pts) != null);
    const money = (y, pts) => (usdMode ? usdOf(y.t, pts) : pts);
    const net = known.reduce((a, y) => a + money(y, y.pts), 0);
    const changed = taken.filter(isChanged);
    const cmp = changed.filter((t) => isNum(t.myPnl) && isNum(planPts(t)));
    const chgCost = cmp.reduce((a, t) => a + (t.myPnl - planPts(t)), 0);

    // equity in trade order, and the same trades as the indicator showed them
    const eq = { you: [0], plan: [0], rows: [null], usd: usdMode, dd: 0 };
    let cy = 0, cp = 0, peak = 0, planOk = changed.length > 0;
    for (const y of known) {
      cy += money(y, y.pts);
      peak = Math.max(peak, cy);
      eq.dd = Math.min(eq.dd, cy - peak);
      const pp = planPts(y.t);
      if (!isNum(pp)) planOk = false;
      cp += money(y, isNum(pp) ? pp : y.pts);
      eq.you.push(cy); eq.plan.push(cp); eq.rows.push(y);
    }
    if (!planOk) eq.plan = null;

    // blocks of 20 wins and losses
    const blocks = [];
    let cur = { w: 0, l: 0, be: 0, items: [] };
    for (const s of plan) {
      if (s.res === 1 || s.res === -1) {
        cur.items.push(s);
        if (s.res === 1) cur.w++; else cur.l++;
        if (cur.items.length === 20) { blocks.push(cur); cur = { w: 0, l: 0, be: 0, items: [] }; }
      } else if (s.res === 0) cur.be++;
    }
    const range20 = p0 != null ? binomRange(20, p0) : null;

    // the last 14 NY evenings
    const end = eveningDate();
    const days = [];
    for (let i = 13; i >= 0; i--) {
      const ds = addDays(end, -i);
      const list = yours.filter((y) => y.t.date === ds);
      const k = list.filter((y) => isNum(y.pts));
      const pts = k.reduce((a, y) => a + y.pts, 0);
      const usdOk = k.length > 0 && k.every((y) => usdOf(y.t, y.pts) != null);
      const usdV = usdOk ? k.reduce((a, y) => a + usdOf(y.t, y.pts), 0) : null;
      const v = usdOk ? usdV : pts;
      const w = list.filter((y) => y.res === 1).length, l = list.filter((y) => y.res === -1).length;
      days.push({ ds, n: list.length, known: k.length, w, l, pts, usd: usdV, today: i === 0, closed: closedNight(ds),
        cls: !list.length ? (closedNight(ds) ? "closed" : "none") : !k.length ? (w > l ? "pos" : l > w ? "neg" : "flat") : v > 0 ? "pos" : v < 0 ? "neg" : "flat" });
    }

    // the plan live, measured the way the backtest year was
    const live = { win2: 0, longestLoss: 0, badNights: 0 };
    let r = 0;
    for (const s of plan) {
      if (s.res === 1) { r = r > 0 ? r + 1 : 1; if (r === 2) live.win2++; }
      else if (s.res === -1) { r = r < 0 ? r - 1 : -1; live.longestLoss = Math.max(live.longestLoss, -r); }
      else if (s.res === 0) r = 0;
    }
    const nightPts = {};
    for (const s of plan) if (isNum(s.pts)) nightPts[s.t.date] = (nightPts[s.t.date] || 0) + s.pts;
    live.badNights = Object.values(nightPts).filter((v) => v * 100 < -1000).length;

    let perWeek = null;
    const firstDate = plan.length && validDate(plan[0].t.date) ? plan[0].t.date : null;
    if (firstDate) { const span = (dUTC(end) - dUTC(firstDate)) / 864e5 + 1; if (span >= 7) perWeek = plan.length / (span / 7); }

    return { bt, p0, all, taken, signals, plan, T, wr, yours, run, bestWin, worstRun, planRun, onPlanN, usdMode, net, nKnown: known.length,
      changed, cmp, chgCost, eq, blocks, cur, range20, days, live, perWeek };
  }

  // ---------- tooltips (text only, never HTML from the data) ----------
  let tipN = 0;
  const tk = (lines) => { const k = "t" + ++tipN; S.tips.set(k, lines); return k; };
  function showTipLines(lines, x, y) {
    tipEl.replaceChildren(...lines.map((ln, i) => { const d = document.createElement("div"); if (i === 0) d.className = "tt"; d.textContent = ln; return d; }));
    tipEl.hidden = false;
    const r = tipEl.getBoundingClientRect();
    let left = x + 14, top = y - r.height - 12;
    if (left + r.width > innerWidth - 8) left = x - r.width - 14;
    if (left < 8) left = 8;
    if (top < 8) top = y + 20;
    tipEl.style.left = left + "px";
    tipEl.style.top = top + "px";
  }
  function hideTip() { tipEl.hidden = true; S.tipFor = null; }
  document.addEventListener("pointerover", (e) => {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (!el || S.modal) return;
    const lines = S.tips.get(el.getAttribute("data-tip"));
    if (lines) { S.tipFor = el; showTipLines(lines, e.clientX, e.clientY); }
  });
  document.addEventListener("pointerout", (e) => {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (el && !el.contains(e.relatedTarget)) hideTip();
  });
  document.addEventListener("focusin", (e) => {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (!el) return;
    const lines = S.tips.get(el.getAttribute("data-tip"));
    if (lines) { const r = el.getBoundingClientRect(); S.tipFor = el; showTipLines(lines, r.left + r.width / 2, r.top); }
  });
  document.addEventListener("focusout", (e) => { if (S.tipFor && S.tipFor.contains(e.target)) hideTip(); });

  // ---------- page pieces ----------
  const rising = () => (Date.now() < S.riseUntil ? " rising" : "");
  function currentTheme() {
    const t = document.documentElement.getAttribute("data-theme");
    if (t) return t;
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function topbar() {
    const nav = [["overview", "Overview"], ["trades", "Trades"], ["calendar", "Calendar"], ["edge", "Edge"]]
      .map(([k, l]) => `<button type="button" data-act="nav" data-v="${k}" data-k="nav:${k}"${S.route === k ? ' aria-current="page"' : ""}>${l}</button>`).join("");
    const dark = currentTheme() === "dark";
    const syncTxt = APP ? syncTitle() : { live: "Saved to your journal on claude.ai", connecting: "Connecting to your journal", offline: "Lost the connection. Tap to reconnect", local: "Journal storage isn't available in this view" }[S.live];
    return `<header class="top">
      <div class="brand">${MARK}<span>Keystone Journal</span></div>
      <nav class="nav" aria-label="Pages">${nav}</nav>
      <div class="tools">
        <div class="clock" id="clock"></div>
        <button type="button" class="round sync ${S.live}" data-act="sync" data-k="sync" title="${esc(syncTxt)}" aria-label="${esc(syncTxt)}">${ICON.sync}<i class="sdot"></i></button>
        <button type="button" class="round" data-act="theme" data-k="theme" title="${dark ? "Light mode" : "Dark mode"}" aria-label="${dark ? "Switch to light mode" : "Switch to dark mode"}">${dark ? ICON.sun : ICON.moon}</button>
      </div>
    </header>`;
  }
  function updateClock() {
    const el = $("#clock");
    if (!el) return;
    const now = Date.now();
    el.innerHTML = `<span>NY <b>${fTime(now, NY)}</b></span><span class="hb">Hobart <b>${fTime(now, HOB)}</b></span>`;
  }
  const pageHead = (eyebrow, h1, lede, extra) => `<section class="head" style="--i:0"><div class="eyebrow">${eyebrow}</div><h1>${h1}</h1><p class="lede">${lede}</p>${extra ? `<div class="head-actions">${extra}</div>` : ""}</section>`;
  const tile = (i, label, value, sub, mod) => `<div class="tile card rz${mod ? " " + mod : ""}" style="--i:${i}"><div class="t-lbl">${label}${mod === "alert" ? '<i class="adot"></i>' : ""}</div><div class="t-num">${dm(value, 34)}</div><div class="t-sub">${sub}</div></div>`;

  function tiles(d) {
    const bt = d.bt, N = bt.normal || {}, T = d.T;
    const btWeek = bt.plan && isNum(bt.plan.perWeek) ? bt.plan.perWeek.toFixed(1) : null;
    const runTxt = d.run > 0 ? d.run + "W" : d.run < 0 ? -d.run + "L" : "0";
    const lossNote = N.lossRuns && N.lossRuns["3"] != null ? `3+ in a row came ${N.lossRuns["3"]}× in the backtest year` : "losses come in runs";
    return [
      tile(1, "Trades", String(d.taken.length), d.perWeek != null ? `${d.perWeek.toFixed(1)} plan trades a week${btWeek ? ` · backtest ${btWeek}` : ""}` : `${plural(d.plan.length, "plan signal")} so far${btWeek ? ` · backtest ${btWeek} a week` : ""}`),
      tile(2, "Plan win rate", d.wr == null ? "-" : Math.round(d.wr * 100) + "%", `${d.p0 != null ? `backtest ${fPct(d.p0)} · ` : ""}${T.w}W ${T.l}L${T.be ? ` ${T.be}BE` : ""}`, d.wr != null && d.p0 != null && T.w + T.l >= 10 && d.wr >= d.p0 ? "good" : ""),
      tile(3, d.usdMode ? "Your net" : "Your net (pts)", d.nKnown ? (d.usdMode ? fUsdC(d.net) : fPts(d.net)) : "-", d.nKnown ? (d.usdMode ? "every account, every contract" : "per contract · add contracts to see $") : "add P&L to see it", d.nKnown && d.net > 0 ? "good" : ""),
      tile(4, "On plan", d.taken.length ? `${d.onPlanN}/${d.taken.length}` : "-", d.taken.length ? (d.planRun > 1 ? `${d.planRun} in a row as the indicator showed` : "taken as the indicator showed") : "trades taken as shown"),
      tile(5, "Current run", d.yours.length ? runTxt : "-", d.run < 0 ? lossNote : d.bestWin ? `best ${d.bestWin}W` : "wins and losses in a row"),
      tile(6, "Changing things", d.cmp.length ? fPts(d.chgCost) : "0", d.cmp.length ? `pts per contract against as shown · ${plural(d.changed.length, "trade")} changed` : "every trade taken as shown", d.cmp.length && d.chgCost < 0 ? "alert" : d.cmp.length && d.chgCost > 0 ? "good" : ""),
    ].join("");
  }

  function ballHtml(y) {
    const t = y.t, s = SETUP[t.setup] || { tag: "?" };
    const cls = y.res === 1 ? "win" : y.res === -1 ? "loss" : y.res === 0 ? "be" : "unk";
    const lines = [
      (y.res === 1 ? "Target" : y.res === -1 ? "Stopped" : y.res === 0 ? "Break-even" : "No result yet") + (isNum(y.pts) ? ` · ${fPts(y.pts)} pts` : ""),
      `${t.aplus ? "A+ " : ""}${s.tag} ${t.dir || ""} · ${whenParts(t).ny}`,
    ];
    if (isChanged(t)) lines.push(`Changed: ${(t.changes || []).map((c) => CHG[c] || c).join(", ") || "something"}${isNum(planPts(t)) ? ` · as shown ${fPts(planPts(t))}` : ""}`);
    if (t.account) lines.push(t.account);
    return `<button type="button" class="ball ${cls}" data-act="edit" data-id="${esc(t.id)}" data-k="ball:${esc(t.id)}" data-tip="${tk(lines)}" aria-label="${esc(lines.join(". "))}"><i></i>${isChanged(t) ? '<b class="chg"></b>' : ""}${t.aplus ? '<b class="ap"></b>' : ""}</button>`;
  }
  function cardRuns(d, i) {
    const N = d.bt.normal || null, run = d.run;
    const big = !d.yours.length ? "-" : run > 0 ? run + "W" : run < 0 ? -run + "L" : "0";
    const cap = !d.yours.length ? "no trades yet" : run >= 2 ? "wins in a row" : run === 1 ? "win · the last trade" : run <= -2 ? "losses in a row" : run === -1 ? "loss · the last trade" : "the last trade broke even";
    let ctx = "Each ball is one trade on one account, oldest first. Tap one to open it.";
    if (N && run <= -2) {
      const k = N.lossRuns ? N.lossRuns[String(-run)] : null;
      if (k != null) ctx = `Runs of ${-run} or more losses came ${k} times in the backtest year. They're part of ${d.p0 != null ? `a ${fPct(d.p0)}` : "the"} plan, not a sign it broke.`;
      else if (-run > (N.longestLossRun || 0)) ctx = `That's longer than any losing run in the backtest year (the longest was ${N.longestLossRun}). Worth checking whether anything was changed.`;
    } else if (N && run >= 2 && N.winRuns && N.winRuns["2"] != null) ctx = `Runs of 2 or more wins came ${N.winRuns["2"]} times in the backtest year. Each ball is one trade on one account; tap one to open it.`;
    return `<article class="card s12 rz" style="--i:${i}">
      <div class="card-h"><h2>Every trade</h2><span class="note">${d.yours.length ? plural(d.yours.length, "trade") + " taken, oldest first" : "Your trades show here as you log them"}</span></div>
      <div class="card-b runs-b">
        <div class="run-now">${dm(big, 56, d.yours.length ? `${Math.abs(run)} ${cap}` : "No trades yet")}<div class="cap">${cap}</div>
          <dl class="run-stats"><div><dt>Best run</dt><dd>${d.bestWin ? plural(d.bestWin, "win") : "–"}</dd></div><div><dt>On plan</dt><dd>${d.planRun ? d.planRun + " in a row" : "–"}</dd></div></dl></div>
        <div><div class="balls">${d.yours.slice(-150).map(ballHtml).join("") || '<span class="empty-b">No trades yet</span>'}</div>${d.yours.length > 150 ? `<p class="ctx" style="margin-top:6px">Showing the last 150 of ${d.yours.length}. The Trades page has them all.</p>` : ""}
          <div class="legend"><span><i class="lg win"></i>Target</span><span><i class="lg loss"></i>Stop</span><span><i class="lg be"></i>Break-even</span><span><i class="lg chg"></i>You changed it</span><span><i class="lg ap"></i>A+</span></div>
          <p class="ctx">${esc(ctx)}</p></div>
      </div>
    </article>`;
  }

  function cardFort(d, i) {
    const WD = ["S", "M", "T", "W", "T", "F", "S"];
    const cols = d.days.map((x) => {
      const money = x.known ? (x.usd != null ? fUsd(x.usd) : fPts(x.pts) + " pts") : "";
      const lines = x.n
        ? [money || `${x.w}W ${x.l}L`, `${dLabel(x.ds)} · ${plural(x.n, "trade")} · ${x.w}W ${x.l}L`]
        : [dLabel(x.ds), x.closed ? "No evening session" : "No trades"];
      if (x.today) lines.push("The latest NY evening");
      return `<div class="fd ${x.cls}${x.today ? " today" : ""}" data-tip="${tk(lines)}"${x.n ? ` tabindex="0" data-k="day:${x.ds}"` : ""}><span class="wd">${WD[wday(x.ds)]}</span><span class="c" aria-hidden="true"></span><span class="dn">${Number(x.ds.slice(8))}</span></div>`;
    }).join("");
    const ticks = d.days.map((x) => `<i${x.today ? ' class="now"' : ""}></i>`).join("");
    const act = d.days.filter((x) => x.n);
    const allUsd = act.length > 0 && act.every((x) => x.usd != null);
    const tot = act.reduce((a, x) => a + (allUsd ? x.usd : x.pts), 0);
    const foot = act.length ? `${act.filter((x) => x.cls === "pos").length} green · ${act.filter((x) => x.cls === "neg").length} red · ${allUsd ? fUsd(tot) : fPts(tot) + " pts"}` : "No trades in the last two weeks yet";
    return `<article class="card s5 rz" style="--i:${i}"><div class="card-h"><h2>Last 14 nights</h2><button type="button" class="more-btn" data-act="nav" data-v="calendar" data-k="to-cal">Open the calendar</button></div>
      <div class="card-b"><div class="fort">${cols}</div><div class="ruler" aria-hidden="true">${ticks}</div><p class="foot">${foot}</p></div></article>`;
  }

  function cardBlock(d, i) {
    const b = d.cur, n = b.items.length, [lo, hi] = d.range20 || [null, null], p0 = d.p0, k = d.blocks.length + 1;
    const slots = Array.from({ length: 20 }, (_, j) => { const s = b.items[j]; return `<i class="slot ${s ? (s.res === 1 ? "win" : "loss") : "todo"}"></i>`; }).join("");
    const pos = (v) => ((Math.max(0, Math.min(20, v)) / 20) * 100).toFixed(2) + "%";
    let marks = "";
    for (let j = 0; j <= 20; j++) marks += `<i class="tk${j % 5 ? "" : " maj"}" style="left:${pos(j)}"></i>${j % 5 ? "" : `<span class="tl" style="left:${pos(j)}">${j}</span>`}`;
    const pace = p0 != null ? b.w + (20 - n) * p0 : null;
    const showPace = pace != null && n > 0 && n < 20;
    const scale = `<div class="scale" role="img" aria-label="${b.w} wins so far in this block${lo != null ? `; a normal finish is ${lo} to ${hi} wins out of 20` : ""}"><span class="track"></span>${lo != null ? `<span class="band" style="left:${pos(lo)};width:calc(${pos(hi)} - ${pos(lo)})"></span>` : ""}${marks}${showPace ? `<span class="pace" style="left:${pos(pace)}"></span>` : ""}<span class="now" style="left:${pos(b.w)}"></span></div>`;
    const txt = n === 0
      ? d.blocks.length ? `Block ${k} starts with the next plan trade.` : "Your first block starts with your first plan trade."
      : `${plural(b.w, "win")} from ${n} so far${b.be ? ` (plus ${plural(b.be, "break-even")})` : ""}.${lo != null ? ` A ${fPct(p0)} plan finishes 20 with ${lo} to ${hi} wins 9 times in 10, so judge it on the block, not the last trade.` : " Judge the plan on the block, not the last trade."}`;
    const past = d.blocks.map((bl, j) => `<span class="chip ${lo != null && bl.w < lo ? "late" : "ok"}"><i></i>Block ${j + 1} · ${bl.w}/20</span>`).join("");
    return `<article class="card s7 rz" style="--i:${i}"><div class="card-h"><h2>This block of 20</h2><span class="note">Block ${k} · the plan's results, 20 wins and losses at a time</span></div>
      <div class="card-b"><div class="slots" aria-hidden="true">${slots}</div>${scale}
        <div class="scale-key">${lo != null ? `<span><i class="k-band"></i>Normal finish, ${lo}–${hi} wins</span>` : ""}<span><i class="k-now"></i>Wins so far</span>${showPace ? `<span><i class="k-pace"></i>On pace for about ${Math.round(pace)}</span>` : ""}</div>
        <p class="ctx">${esc(txt)}</p>${past ? `<div class="past">${past}</div>` : ""}</div></article>`;
  }

  function normalCards(d, i) {
    const N = d.bt.normal;
    if (!N) return "";
    const v = (x) => (x == null ? "–" : esc(x));
    return `
      <article class="pastel p-lilac s4 rz" style="--i:${i}"><span class="ppill">Backtest year</span><div class="big">${v(N.winRuns && N.winRuns["2"])}</div><p>times the plan won 2 or more in a row</p><p class="small">Live so far: ${d.live.win2}</p></article>
      <article class="pastel p-mauve s4 rz" style="--i:${i + 1}"><span class="ppill">Backtest year</span><div class="big">${v(N.lossRuns && N.lossRuns["3"])}</div><p>runs of 3 or more losses in a row. The longest was ${v(N.longestLossRun)}.</p><p class="small">Live so far: longest ${d.live.longestLoss}</p></article>
      <article class="pastel p-fog s4 rz" style="--i:${i + 2}"><span class="ppill">Any 20 trades in a row</span><div class="big">${N.block20 ? `${v(N.block20.min)}–${v(N.block20.max)}` : "–"}</div><p>wins, from the worst stretch of the backtest year to the best</p><p class="small">${v(N.badNights)} nights a year lost more than $1,000 at 1 GC</p></article>`;
  }

  function cardEquity(d, i) {
    const E = d.eq;
    const keys = E.plan ? `<div class="keys"><span><i class="k-you"></i>You</span><span><i class="k-plan"></i>The same trades as the indicator showed</span></div>` : "";
    const foot = d.nKnown ? `Worst drawdown ${E.usd ? fUsd(E.dd) : fPts(E.dd) + " pts"} · longest losing run ${plural(d.worstRun, "trade")}` : "";
    return `<article class="card s12 rz" style="--i:${i}"><div class="card-h"><h2>Equity</h2><span class="note">${E.usd ? "Dollars across your accounts" : "Points per contract"}, in trade order</span></div>
      <div class="card-b">${keys}<div class="eq" id="eqBox"></div>${foot ? `<p class="foot">${foot}</p>` : ""}</div></article>`;
  }

  function pageOverview(d) {
    const now = Date.now();
    const eyebrow = `${esc(fmt(now, HOB, { weekday: "long", day: "numeric", month: "long" }))} in Hobart · NY session ${esc(dLabel(lastSession(now)))}`;
    let lede;
    if (!S.loaded) lede = "Loading your journal…";
    else if (!S.trades.length) lede = "Log each trade with the button below. The steps are under Trades › How to log a trade.";
    else {
      const last = d.days.slice().reverse().find((x) => x.n && x.known);
      lede = `${plural(d.taken.length, "trade")} logged · the plan is ${d.wr == null ? "–" : fPct(d.wr)} live${d.p0 != null ? ` against ${fPct(d.p0)} in the backtest` : ""}${last ? ` · ${dLabel(last.ds)} ${last.usd != null ? fUsd(last.usd) : fPts(last.pts) + " pts"}` : ""}`;
    }
    const notice = APP && S.loaded && !syncCfg().token ? `<div class="card notice rz" style="--i:1"><p><b>Saved on this device only.</b> Turn on sync to use the journal on your phone and your Mac, and to let Claude read your trades.</p><button type="button" class="pill" data-act="sync" data-k="notice-sync">Set up sync</button></div>` : "";
    return `<main class="page${rising()}">${pageHead(eyebrow, "Keystone Journal", esc(lede))}${notice}
      <section class="tiles" aria-label="Summary">${tiles(d)}</section>
      <section class="grid">${cardRuns(d, 7)}${cardFort(d, 8)}${cardBlock(d, 9)}${normalCards(d, 10)}${cardEquity(d, 13)}</section></main>`;
  }

  // ---------- trades page ----------
  function row(t) {
    const s = SETUP[t.setup] || { tag: t.setup || "?" };
    const w = whenParts(t);
    const title = `${t.aplus ? "A+ " : ""}${s.tag} · ${t.dir === "long" ? "Long" : t.dir === "short" ? "Short" : "–"}`;
    const sub = [t.time ? `${t.time} NY` : "No time", w.hbShort, t.account, isNum(t.qty) && t.qty > 0 ? `${t.qty} ${t.instrument || "GC"}` : ""].filter(Boolean).join(" · ");
    const pr = planRes(t);
    const chips = [`<span class="chip ${pr === 1 ? "ok" : pr === -1 ? "loss" : ""}"><i></i>${esc(OUT[t.outcome] || "No result")}</span>`];
    if (!isTaken(t)) chips.push(`<span class="chip"><i></i>Missed</span>`);
    if (isChanged(t)) chips.push(`<span class="chip due"><i></i>Changed: ${esc((t.changes || []).map((c) => CHG[c] || c).join(", ") || "something")}</span>`);
    if (t.setup === "off") chips.push(`<span class="chip due"><i></i>Off-plan</span>`);
    const yp = yourPts(t), pp = planPts(t), u = usdOf(t, yp);
    const amt = !isTaken(t)
      ? `<span class="p">${isNum(pp) ? fPts(pp) : "–"}</span><span class="d">the plan</span>`
      : `<span class="p">${isNum(yp) ? fPts(yp) : "–"}</span><span class="d">${u != null ? fUsd(u) : isChanged(t) && isNum(pp) ? "as shown " + fPts(pp) : isNum(yp) ? "pts" : "add P&L"}</span>`;
    const shot = t.shot ? `<button type="button" class="thumb" data-act="shot" data-v="${esc(t.shot)}" aria-label="Open the chart screenshot"><img src="${esc(assetSrc(t.shot))}" data-asset="${esc(t.shot)}" alt="" loading="lazy"></button>` : "";
    return `<div class="row${isTaken(t) ? "" : " missed"}" data-act="edit" data-id="${esc(t.id)}" data-k="row:${esc(t.id)}" role="button" tabindex="0" aria-label="${esc(title + ", " + w.ny)}">
      ${setupTile(t)}
      <div><div class="r-t">${esc(title)}</div><div class="r-s">${esc(sub)}</div><div class="r-chips">${chips.join("")}</div></div>
      ${shot}<div class="amt">${amt}</div><span class="round sm go" aria-hidden="true">${ICON.arrow}</span></div>`;
  }
  function pageTrades(d) {
    const F = [["all", "All"], ["close", "Close"], ["tapback", "Tap back"], ["close2", "2nd close"], ["ob", "OB"], ["off", "Off-plan"], ["aplus", "A+"], ["changed", "Changed"], ["missed", "Missed"]];
    const match = (t, k) => (k === "all" ? true : k === "aplus" ? !!t.aplus : k === "changed" ? isChanged(t) : k === "missed" ? !isTaken(t) : t.setup === k);
    const counts = Object.fromEntries(F.map(([k]) => [k, d.all.filter((t) => match(t, k)).length]));
    if (S.filter !== "all" && !counts[S.filter]) S.filter = "all";
    const chips = F.filter(([k]) => k === "all" || counts[k]).map(([k, l]) => `<button type="button" class="fchip" data-act="filter" data-v="${k}" data-k="filter:${k}" aria-pressed="${S.filter === k}">${l}<span>${counts[k]}</span></button>`).join("");
    const list = d.all.filter((t) => match(t, S.filter)).reverse();
    const byDate = new Map();
    for (const t of list) { const k = validDate(t.date) ? t.date : "none"; if (!byDate.has(k)) byDate.set(k, []); byDate.get(k).push(t); }
    const groups = [...byDate].map(([ds, ts]) => {
      const k = ts.filter((t) => isNum(yourPts(t)));
      const allUsd = k.length > 0 && k.every((t) => usdOf(t, yourPts(t)) != null);
      const net = k.reduce((a, t) => a + (allUsd ? usdOf(t, yourPts(t)) : yourPts(t)), 0);
      const nt = k.length ? (allUsd ? fUsd(net) : fPts(net) + " pts") : "";
      return `<div class="sess"><div class="sess-h"><span class="sd">${ds === "none" ? "No date" : esc(dLabel(ds))}</span><span class="sn">${plural(ts.length, "trade")}${nt ? " · " + nt : ""}</span></div>${ts.map(row).join("")}</div>`;
    }).join("");
    const missed = d.all.length - d.taken.length;
    const lede = d.all.length ? `${plural(d.taken.length, "trade")} taken${missed ? ` · ${missed} missed` : ""}. Grouped by NY evening; tap a trade to open it.` : "Nothing logged yet. Use “Log a trade” below.";
    const actions = `<button type="button" class="pill" data-act="guide" data-k="guide">How to log a trade</button>` + (S.downloads && d.all.length ? `<button type="button" class="pill" data-act="export" data-k="export">${ICON.download}Export CSV</button>` : "");
    return `<main class="page${rising()}">${pageHead(esc(`${d.signals.length} signals · ${d.all.length} entries`), "Trades", esc(lede), actions)}
      ${d.all.length ? `<div class="filters rz" style="--i:1" role="group" aria-label="Filter the trades">${chips}</div>` : ""}
      <article class="card list rz" style="--i:2">${groups || `<p class="empty">${d.all.length ? "No trades match this filter." : "No trades yet."}</p>`}</article></main>`;
  }

  // ---------- calendar: the month, each NY evening's trades and result ----------
  const cMoney = (v, usdM) => { if (!usdM) return fPts(v); const a = Math.abs(v); return Math.round(a) === 0 ? "$0" : sgn(v) + "$" + (a >= 1000 ? (a / 1000).toFixed(1).replace(/\.0$/, "") + "k" : Math.round(a)); };
  function pageCalendar(d) {
    const now = eveningDate();
    if (!S.cal) S.cal = { y: Number(now.slice(0, 4)), mo: Number(now.slice(5, 7)) - 1, day: null };
    const { y, mo } = S.cal, pad = (n) => String(n).padStart(2, "0");
    const key = `${y}-${pad(mo + 1)}`;
    const nDays = new Date(Date.UTC(y, mo + 1, 0, 12)).getUTCDate();
    const lead = new Date(Date.UTC(y, mo, 1, 12)).getUTCDay();
    const label = new Intl.DateTimeFormat("en-GB", { timeZone: "UTC", month: "long", year: "numeric" }).format(new Date(Date.UTC(y, mo, 1, 12)));
    const mine = d.yours.filter((x) => (x.t.date || "").startsWith(key));
    const known = mine.filter((x) => isNum(x.pts));
    const usdM = known.length > 0 && known.every((x) => usdOf(x.t, x.pts) != null);
    const val = (x) => (usdM ? usdOf(x.t, x.pts) : x.pts);
    const byDay = {}, missed = {};
    for (const x of mine) (byDay[x.t.date] = byDay[x.t.date] || []).push(x);
    for (const t of d.all) if (!isTaken(t) && (t.date || "").startsWith(key)) (missed[t.date] = missed[t.date] || []).push(t);
    const info = (ds) => {
      const L = byDay[ds] || [], k = L.filter((x) => isNum(x.pts));
      const w = L.filter((x) => x.res === 1).length, l = L.filter((x) => x.res === -1).length;
      const net = k.reduce((a, x) => a + val(x), 0);
      return { L, k, w, l, net, cls: !L.length ? "" : k.length ? (net > 0 ? "pos" : net < 0 ? "neg" : "") : w > l ? "pos" : l > w ? "neg" : "" };
    };
    const daysWith = Object.keys(byDay).concat(Object.keys(missed)).sort();
    const sel = S.cal.day && S.cal.day.startsWith(key) ? S.cal.day : daysWith.length ? daysWith[daysWith.length - 1] : null;
    // the month grid, Sunday first (CME gold's evenings run Sunday to Thursday), with a total for each week
    let grid = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((w) => `<span class="mh">${w}</span>`).join("") + '<span class="mh wk">Week</span>';
    const slots = Math.ceil((lead + nDays) / 7) * 7;
    let wk = { n: 0, net: 0, w: 0, l: 0, known: 0 };
    for (let i = 0; i < slots; i++) {
      const dd = i - lead + 1;
      if (dd < 1 || dd > nDays) grid += '<span class="cd blank" aria-hidden="true"></span>';
      else {
        const ds = `${key}-${pad(dd)}`, x = info(ds), ms = missed[ds] || [];
        wk.n += x.L.length; wk.w += x.w; wk.l += x.l; wk.net += x.net; wk.known += x.k.length;
        const today = ds === now ? " today" : "", isSel = ds === sel;
        if (!x.L.length && !ms.length && (closedNight(ds) || ds > now)) grid += `<span class="cd ${closedNight(ds) ? "closed" : "future"}${today}"><span class="cd-n">${dd}</span></span>`;
        else {
          const v = x.L.length ? (x.k.length ? cMoney(x.net, usdM) : `${x.w}W ${x.l}L`) : "";
          const balls = x.L.slice(0, 10).map((b) => `<i class="${b.res === 1 ? "win" : b.res === -1 ? "loss" : b.res === 0 ? "be" : "unk"}"></i>`).join("");
          const aria = `${dLabel(ds)}: ${x.L.length ? `${plural(x.L.length, "trade")}, ${x.w} won, ${x.l} lost${x.k.length ? ", " + (usdM ? fUsd(x.net) : fPts(x.net) + " points") : ""}` : "no trades"}${ms.length ? `, ${ms.length} missed` : ""}`;
          grid += `<button type="button" class="cd ${x.cls}${today}${isSel ? " sel" : ""}" data-act="month-day" data-v="${ds}" data-k="mday:${ds}" aria-pressed="${isSel}" aria-label="${esc(aria)}"><span class="cd-n">${dd}</span>${v ? `<span class="cd-v">${esc(v)}</span>` : ""}${balls ? `<span class="cd-b">${balls}</span>` : ""}${ms.length && !x.L.length ? `<span class="cd-m">${ms.length} missed</span>` : ""}</button>`;
        }
      }
      if (i % 7 === 6) {
        grid += `<span class="cw"><span class="cw-l">Week</span><span class="cw-v">${wk.n ? (wk.known ? esc(cMoney(wk.net, usdM)) : "–") : "–"}</span><span class="cw-s">${wk.n ? `${wk.w}W ${wk.l}L` : ""}</span></span>`;
        wk = { n: 0, net: 0, w: 0, l: 0, known: 0 };
      }
    }
    const act = Object.keys(byDay).map(info);
    const W = mine.filter((x) => x.res === 1).length, Lo = mine.filter((x) => x.res === -1).length;
    const mNet = known.reduce((a, x) => a + val(x), 0);
    const sum = mine.length

  // ---------- edge page ----------
  function verdict(w, l, p0) {
    const n = w + l;
    if (n < 10) return { cls: "", text: `Too early · ${n}/10` };
    if (!isNum(p0)) return { cls: "", text: "No backtest" };
    const [lo, hi] = wilson(w, n);
    if (p0 < lo) return { cls: "ok", text: "Above backtest" };
    if (p0 > hi) return { cls: "late", text: "Below backtest" };
    return { cls: "ok", text: "In line" };
  }
  function edgeRow(av, name, list, p0, total) {
    const w = list.filter((s) => s.res === 1).length, l = list.filter((s) => s.res === -1).length, be = list.filter((s) => s.res === 0).length;
    const n = w + l, wr = n ? w / n : null, ci = wilson(w, n), v = verdict(w, l, p0);
    let bar = "";
    if (ci) bar += `<span class="band" style="left:${(ci[0] * 100).toFixed(1)}%;width:${((ci[1] - ci[0]) * 100).toFixed(1)}%"></span>`;
    if (isNum(p0)) bar += `<span class="bt" style="left:${(p0 * 100).toFixed(1)}%"></span>`;
    if (wr != null) bar += `<span class="dot" style="left:${(wr * 100).toFixed(1)}%"></span>`;
    const tip = tk([wr == null ? "No results yet" : `Live ${fPct(wr)} · backtest ${isNum(p0) ? fPct(p0) : "–"}`, `${name}: ${w}W ${l}L${be ? ` ${be}BE` : ""}`, ci ? `The true rate is likely ${fPct(ci[0])} to ${fPct(ci[1])}` : "Needs some results first"]);
    return `<div class="e-row${total ? " total" : ""}"><div class="e-name">${av}<span>${esc(name)}</span></div>
      <div class="e-rec">${w}–${l}–${be}<span class="alt"> · live ${wr == null ? "–" : fPct(wr)} · backtest ${isNum(p0) ? fPct(p0) : "–"}</span></div>
      <div class="e-bar" data-tip="${tip}" tabindex="0" data-k="ebar:${esc(name)}" role="img" aria-label="${esc(`${name}: live ${wr == null ? "none yet" : fPct(wr)}, backtest ${isNum(p0) ? fPct(p0) : "none"}`)}"><div class="bar">${bar}</div></div>
      <div class="e-live">${wr == null ? "–" : fPct(wr)}</div><div class="e-bt">${isNum(p0) ? fPct(p0) : "–"}</div>
      <div class="e-v"><span class="chip ${v.cls}"><i></i>${v.text}</span></div></div>`;

  function cardBlocks(d, i) {
    const [lo, hi] = d.range20 || [null, null];
    const pos = (v) => ((Math.max(0, Math.min(20, v)) / 20) * 100).toFixed(2) + "%";
    const rows = d.blocks.map((b, j) => ({ b, k: j + 1, done: true })).concat(d.cur.items.length ? [{ b: d.cur, k: d.blocks.length + 1, done: false }] : []);
    const html = rows.map(({ b, k, done }) => {
      const st = !done ? ["", "in progress"] : lo == null ? ["", "done"] : b.w < lo ? ["late", "below normal"] : b.w > hi ? ["ok", "above normal"] : ["ok", "normal"];
      return `<div class="b-row"><span>Block ${k}</span><div class="mini" role="img" aria-label="${b.w} wins from ${b.items.length}">${lo != null ? `<span class="band" style="left:${pos(lo)};width:calc(${pos(hi)} - ${pos(lo)})"></span>` : ""}<span class="dot" style="left:${pos(b.w)}"></span></div><span class="b-w">${b.w}/${b.items.length}</span><span class="chip ${st[0]}"><i></i>${st[1]}</span></div>`;
    }).join("");
    return `<article class="card s6 rz" style="--i:${i};align-self:start"><div class="card-h"><h2>Blocks of 20</h2><span class="note">${lo != null ? `Normal finish ${lo}–${hi} wins (9 in 10)` : "Twenty wins and losses at a time"}</span></div>
      ${html || `<p class="empty">Blocks fill as you log plan trades. Twenty wins and losses make one.</p>`}<div style="height:10px"></div></article>`;
  }
  function cardBacktest(d, i) {
    const bt = d.bt, set = bt.setups || {};

    const rows = PLAN_SETUPS.map((s) => line(tileIc(s.key, "sm"), s.name, set[s.key] && set[s.key].bracket, set[s.key])).join("")

  function cardTested(d, i) {

      <p class="small">With its stop cut to 5 points it wins ${fPct(H.closeStop5WinRate)} instead of ${fPct(H.closeWinRate)}, and makes +${esc(H.closeStop5Net)} points a year instead of +${esc(H.closeNet)}. The plan's numbers only hold with the plan's stop.</p></article>`;
  }
  function sizeOut() {

  function pageEdge(d) {

    const btMissing = APP && S.loaded && !(bt.plan && isNum(bt.plan.winRate)) ? `<div class="card notice rz" style="--i:1"><p><b>Your backtest numbers aren't on this device yet.</b> They're kept off the public app, like your trades. Import them from your backup file, or turn on sync to pull them from your gist.</p><button type="button" class="pill" data-act="sync" data-k="bt-sync">Sync and backup</button></div>` : "";
    return `<main class="page${rising()}">${btMissing}${pageHead(eyebrow, "The edge", "The plan's live results against the backtest year. A trade you changed still counts here as the indicator's result: this page tests the plan, the Overview tests how you traded it.", toggle)}
      <section class="grid" style="margin-top:0">

          <div class="e-legend"><span><i class="lg-dot"></i>Live win rate</span><span><i class="lg-band"></i>Where the true rate likely is (95%)</span><span><i class="lg-bt"></i>Backtest</span></div></article>
        ${cardBlocks(d, 2)}${cardBacktest(d, 3)}${cardTested(d, 4)}${cardSizer(5)}

  // ---------- equity chart ----------
  function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
  function drawEquity(d) {
    const box = document.getElementById("eqBox");
    if (!box) return;
    const E = d.eq;
    if (E.you.length < 3) {
      box.classList.add("is-empty");
      box.innerHTML = `<p class="ctx" style="margin:0">The line starts once two trades have points. Each trade adds its result in order, so the run-ups and the drawdowns show.</p>`;
      return;
    }
    box.classList.remove("is-empty");
    const W = Math.max(260, Math.floor(box.getBoundingClientRect().width)), H = 230, L = 58, R = 18, T = 20, B = 28;
    const vals = E.plan ? E.you.concat(E.plan) : E.you;
    let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
    if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
    const step = niceStep((hi - lo) / 4);
    lo = Math.floor(lo / step + 1e-9) * step;
    hi = Math.ceil(hi / step - 1e-9) * step;
    const n = E.you.length - 1;
    const X = (i) => L + (i * (W - L - R)) / n, Y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
    const fv = (v) => (E.usd ? fUsdC(v) : fPts(v));
    const fAxis = (v) => (E.usd ? fUsdC(v) : sgn(v) + Math.abs(v).toFixed(step < 1 ? 1 : 0));
    let g = "";
    for (let v = lo, j = 0; v <= hi + step / 2 && j < 12; v += step, j++) {
      const y = Y(v).toFixed(1), zero = Math.abs(v) < step / 1e6;
      g += `<line class="${zero ? "eq-zero" : "eq-grid"}" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="eq-lbl" x="${L - 10}" y="${(+y + 4).toFixed(1)}" text-anchor="end">${zero ? "0" : esc(fAxis(v))}</text>`;
    }
    const path = (a) => a.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
    const area = `${path(E.you)} L${X(n).toFixed(1)} ${Y(0).toFixed(1)} L${X(0).toFixed(1)} ${Y(0).toFixed(1)} Z`;
    const last = E.you[n], ex = X(n), ey = Y(last);
    // the end label sits on the side away from the other line, inside the plot
    const below = (E.plan && Y(E.plan[n]) < ey) || ey - 10 < T + 12;
    const ly = below && ey + 22 <= H - B ? ey + 22 : ey - 10;
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Equity over ${n} trades, ending at ${esc(fv(last))}${E.plan ? `; the same trades as the indicator showed end at ${esc(fv(E.plan[n]))}` : ""}">
      ${g}<path class="eq-area" d="${area}"/>${E.plan ? `<path class="eq-plan" d="${path(E.plan)}"/>` : ""}<path class="eq-you" d="${path(E.you)}"/>
      ${E.plan ? `<circle class="eq-dot plan" cx="${ex.toFixed(1)}" cy="${Y(E.plan[n]).toFixed(1)}" r="4"/>` : ""}<circle class="eq-dot you" cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4.5"/>
      <text class="eq-end" x="${(ex - 10).toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="end">${esc(fv(last))}</text>
      <text class="eq-lbl" x="${L}" y="${H - 6}">start</text><text class="eq-lbl" x="${W - R}" y="${H - 6}" text-anchor="end">trade ${n}</text>
      <line class="eq-x" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/>
      <rect class="eq-hit" x="${L - 6}" y="0" width="${W - L - R + 12}" height="${H}" fill="transparent"/></svg>`;
    const hit = box.querySelector(".eq-hit"), xl = box.querySelector(".eq-x");
    const show = (clientX) => {
      const r = box.querySelector("svg").getBoundingClientRect();
      const px = ((clientX - r.left) / r.width) * W;
      const i = Math.max(1, Math.min(n, Math.round(((px - L) / (W - L - R)) * n)));
      xl.setAttribute("x1", X(i).toFixed(1)); xl.setAttribute("x2", X(i).toFixed(1)); xl.setAttribute("visibility", "visible");
      const y = E.rows[i], t = y.t, s = SETUP[t.setup] || { tag: "?" };
      const one = E.usd ? usdOf(t, y.pts) : y.pts;
      const lines = [`${fv(E.you[i])}${E.usd ? "" : " pts"} after trade ${i}`];
      if (E.plan) lines.push(`As the indicator showed: ${fv(E.plan[i])}`);
      lines.push(`${t.aplus ? "A+ " : ""}${s.tag} · ${whenParts(t).ny} · ${fv(one)}`);
      showTipLines(lines, clientX, r.top + (Y(E.you[i]) / H) * r.height);
    };
    hit.addEventListener("pointermove", (e) => show(e.clientX));
    hit.addEventListener("pointerdown", (e) => show(e.clientX));
    hit.addEventListener("pointerleave", () => { xl.setAttribute("visibility", "hidden"); hideTip(); });
  }

  // ---------- toast with undo ----------

  function openModal(id, opts) {

  function opt(act, fld, v, label, on, extra) {
